[task]
name = "surge-test-reduction"
description = "Surge line of a centrifugal gas compressor from its surge test, in the anti-surge controller's coordinates: from one test's 5 Hz records (speed, recycle valve, two suction and one discharge pressure, flange temperatures, two venturi differentials), compressor sheet and shift log, the program returns q_r2 of the surge line at three control heads. It is applied to the tests of five held-back compressors."
authors = [{ name = "", email = "" }]
keywords = ["centrifugal-compressor", "surge-test", "anti-surge-control", "surge-line", "reduced-coordinates", "gas-compression", "turbomachinery", "held-back-tests"]

